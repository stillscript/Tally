<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="description" content="Scan barcodes, log food in seconds, and hit your calorie and protein targets.">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  // Paint the saved theme before the app loads (no flash of the wrong colors). See js/theme.js.
  (function () {
    var root = document.documentElement, a = {};
    try { a = JSON.parse(localStorage.getItem('tally.appearance') || '{}'); } catch (e) {}
    var mode = a.mode || 'system';
    var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-scheme', dark ? 'dark' : 'light');
    var vars = a.vars && a.vars[dark ? 'dark' : 'light'];
    if (vars) for (var k in vars) root.style.setProperty(k, vars[k]);
  })();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js" crossorigin>
</head>
<body>
<div id="app"><div class="splash"><img src="icons/icon.svg" alt="" width="64" height="64"></div></div>
<noscript>Tally needs JavaScript to run.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
